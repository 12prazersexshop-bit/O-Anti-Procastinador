    <script src="https://cdnjs.cloudflare.com/ajax/libs/html-to-image/1.11.13/html-to-image.min.js" integrity="sha512-iZ2ORl595Wx6miw+GuadDet4WQbdSWS3JLMoNfY8cRGoEFy6oT3G9IbcrBeL6AfkgpA51ETt/faX6yLV+/gFJg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <script>
      (function() {
        const originalConsole = window.console;
        window.console = {
          log: (...args) => {
            originalConsole.log(...args);
            window.parent.postMessage({ type: 'console', message: args.join(' ') }, '*');
          },
          error: (...args) => {
            originalConsole.error(...args);
            window.parent.postMessage({ type: 'console', message: 'Error: ' + args.join(' ') }, '*');
          },
          warn: (...args) => {
            originalConsole.warn(...args);
            window.parent.postMessage({ type: 'console', message: 'Warning: ' + args.join(' ') }, '*');
          }
        };

        let requestId = 0;
        let callbacksMap = new Map();
        let streamControllers = new Map();
        
        window.claude = {
          complete: (prompt) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'claudeComplete', id, prompt }, '*');
            });
          }
        };

        window.storage = {
          get: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageGet', id, key, shared }, '*');
            });
          },
          set: (key, value, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageSet', id, key, value, shared }, '*');
            });
          },
          delete: (key, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageDelete', id, key, shared }, '*');
            });
          },
          list: (prefix, shared = false) => {
            return new Promise((resolve, reject) => {
              const id = requestId++;
              callbacksMap.set(id, { resolve, reject });
              window.parent.postMessage({ type: 'storageList', id, prefix, shared }, '*');
            });
          }
        };

        let pendingBlobs = new Map();
        URL.createObjectURL = (blob) => {
          // Store the blob and create an ID and URL for it
          const blobId = `blob-${Date.now()}-${Math.random()}`;
          pendingBlobs.set(blobId, blob);
          return `blob-request://${blobId}`;
        };

        URL.revokeObjectURL = (url) => {
          // Remove the blob from our store
          const blobId = url.replace("blob-request://", "");
          pendingBlobs.delete(blobId);
        };

        const getBlobFromURL = (url) => {
          const blobId = url.replace("blob-request://", "");
          return pendingBlobs.get(blobId);
        };

        // Override global fetch with streaming support
        window.fetch = (url, init = {}) => {
          return new Promise((resolve, reject) => {
            const id = requestId++;
            const channelId = `fetch-${id}-${Date.now()}`;
            
            callbacksMap.set(id, { 
              resolve: (response) => {
                // Create a ReadableStream for the response body
                const stream = new ReadableStream({
                  start(controller) {
                    streamControllers.set(channelId, controller);
                  },
                  cancel() {
                    streamControllers.delete(channelId);
                  }
                });
                
                // Create and return the Response with the stream
                resolve(new Response(stream, {
                  status: response.status,
                  statusText: response.statusText,
                  headers: response.headers
                }));
              },
              reject,
              channelId
            });
            
            window.parent.postMessage({
              type: 'proxyFetch',
              id,
              url,
              init,
              channelId
            }, '*');
          });
        };

        window.addEventListener('message', async (event) => {
          if (event.data.type === 'takeScreenshot') {
            const rootElement = document.getElementById('artifacts-component-root-html');
            if (!rootElement) {
              window.parent.postMessage({
                type: 'screenshotError',
                error: new Error('Root element not found'),
              }, '*');
            }
            const screenshot = await htmlToImage.toPng(rootElement, {
              imagePlaceholder:
                "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAAAXNSR0IArs4c6QAAAA1JREFUGFdjePDgwX8ACOQDoNsk0PMAAAAASUVORK5CYII=",
            });
            window.parent.postMessage({
              type: 'screenshotData',
              data: screenshot,
            }, '*');
          } else if (event.data.type === 'claudeComplete') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.completion);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'proxyFetchResponse') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
              callbacksMap.delete(event.data.id);
            } else {
              // Initial response with headers, status, etc.
              callback.resolve({
                status: event.data.status,
                statusText: event.data.statusText,
                headers: event.data.headers
              });
              // Don't delete the callback yet if streaming
              if (!event.data.body) {
                callbacksMap.delete(event.data.id);
              }
            }
          } else if (event.data.type === 'proxyFetchStream') {
            // Handle streaming data chunks
            const controller = streamControllers.get(event.data.channelId);
            if (controller) {
              if (event.data.error) {
                controller.error(new Error(event.data.error));
                streamControllers.delete(event.data.channelId);
              } else if (event.data.done) {
                controller.close();
                streamControllers.delete(event.data.channelId);
                // Clean up the callback
                const callback = Array.from(callbacksMap.entries()).find(
                  ([_, value]) => value.channelId === event.data.channelId
                );
                if (callback) {
                  callbacksMap.delete(callback[0]);
                }
              } else if (event.data.chunk) {
                controller.enqueue(new Uint8Array(event.data.chunk));
              }
            }
          } else if (event.data.type === 'storageGet') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageSet') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageDelete') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          } else if (event.data.type === 'storageList') {
            const callback = callbacksMap.get(event.data.id);
            if (event.data.error) {
              callback.reject(new Error(event.data.error));
            } else {
              callback.resolve(event.data.result);
            }
            callbacksMap.delete(event.data.id);
          }
        });

        window.addEventListener('click', (event) => {
          const isEl = event.target instanceof HTMLElement;
          if (!isEl) return;
    
          // find ancestor links
          const linkEl = event.target.closest("a");
          if (!linkEl || !linkEl.href) return;
    
          event.preventDefault();
          event.stopImmediatePropagation();
    
          if (linkEl.href.startsWith("blob-request:")) {
            const blob = getBlobFromURL(linkEl.href);
            if (!blob) return;
            void blob.arrayBuffer().then((data) => {
              window.parent.postMessage({
                type: "downloadFile",
                filename: linkEl.download,
                data,
                mimeType: blob.type || "application/octet-stream",
              });
            });
          } else if (linkEl.href.startsWith("data:")) {
            const [header, base64Data] = linkEl.href.split(",");
            const mimeMatch = header.match(/data:([^;]+)/);
            const mimeType = mimeMatch ? mimeMatch[1] : "application/octet-stream";
            const binaryString = atob(base64Data);
            const data = Uint8Array.from(binaryString, (c) =>
              c.charCodeAt(0),
            ).buffer;
            window.parent.postMessage({
              type: "downloadFile",
              filename: linkEl.download,
              data,
              mimeType,
            });
          } else {
            let linkUrl;
            try {
              linkUrl = new URL(linkEl.href);
            } catch (error) {
              return;
            }
    
            if (linkUrl.hostname === window.location.hostname) return;
      
            window.parent.postMessage({
              type: 'openExternal',
              href: linkEl.href,
            }, '*');
          }
      });

        const originalOpen = window.open;
        window.open = function (url) {
          window.parent.postMessage({
            type: "openExternal",
            href: url,
          }, "*");
        };

        window.addEventListener('error', (event) => {
          window.parent.postMessage({ type: 'console', message: 'Uncaught Error: ' + event.message }, '*');
        });
      })();
    </script>

    <div id="root"></div>

    <script crossorigin="" src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin="" src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const FinancialPlannerApp = () => {
            const presetGoals = [
                { value: 1000, label: 'R$ 1.000', color: 'from-green-400 to-green-600', days: 30 },
                { value: 3000, label: 'R$ 3.000', color: 'from-blue-400 to-blue-600', days: 60 },
                { value: 5000, label: 'R$ 5.000', color: 'from-purple-400 to-purple-600', days: 90 },
                { value: 10000, label: 'R$ 10.000', color: 'from-orange-400 to-orange-600', days: 120 },
                { value: 15000, label: 'R$ 15.000', color: 'from-pink-400 to-pink-600', days: 150 },
                { value: 21000, label: 'R$ 21.000', color: 'from-red-400 to-red-600', days: 180 }
            ];

            const [selectedGoal, setSelectedGoal] = useState(null);
            const [dailyProgress, setDailyProgress] = useState({});
            const [dailyAmounts, setDailyAmounts] = useState({});
            const [showCelebration, setShowCelebration] = useState(false);
            const [currentStreak, setCurrentStreak] = useState(0);
            const [showCustomGoal, setShowCustomGoal] = useState(false);
            const [customValue, setCustomValue] = useState('');
            const [customDays, setCustomDays] = useState('');
            const [userName, setUserName] = useState('');
            const [showNamePrompt, setShowNamePrompt] = useState(true);
            const [notes, setNotes] = useState({});
            const [showStats, setShowStats] = useState(false);
            const [motivationalQuote, setMotivationalQuote] = useState('');

            const quotes = [
                "Pequenas ações diárias criam grandes resultados!",
                "Você está mais perto do seu objetivo do que ontem!",
                "Cada dia economizado é um passo em direção à liberdade financeira!",
                "Disciplina é a ponte entre objetivos e conquistas!",
                "Acredite em você! Você consegue!",
                "O futuro depende do que você faz hoje!",
                "Persistência é o caminho do êxito!",
                "Grandes conquistas começam com pequenos passos!"
            ];

            useEffect(() => {
                const savedName = localStorage.getItem('userName');
                if (savedName) {
                    setUserName(savedName);
                    setShowNamePrompt(false);
                }
                const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
                setMotivationalQuote(randomQuote);
            }, []);

            useEffect(() => {
                if (selectedGoal) {
                    const savedProgress = localStorage.getItem(`progress_${selectedGoal.value}_${selectedGoal.days}`);
                    const savedAmounts = localStorage.getItem(`amounts_${selectedGoal.value}_${selectedGoal.days}`);
                    const savedNotes = localStorage.getItem(`notes_${selectedGoal.value}_${selectedGoal.days}`);
                    
                    if (savedProgress) setDailyProgress(JSON.parse(savedProgress));
                    if (savedAmounts) setDailyAmounts(JSON.parse(savedAmounts));
                    if (savedNotes) setNotes(JSON.parse(savedNotes));
                }
            }, [selectedGoal]);

            useEffect(() => {
                if (selectedGoal && Object.keys(dailyProgress).length > 0) {
                    localStorage.setItem(`progress_${selectedGoal.value}_${selectedGoal.days}`, JSON.stringify(dailyProgress));
                    localStorage.setItem(`amounts_${selectedGoal.value}_${selectedGoal.days}`, JSON.stringify(dailyAmounts));
                    localStorage.setItem(`notes_${selectedGoal.value}_${selectedGoal.days}`, JSON.stringify(notes));
                    calculateStreak();
                }
            }, [dailyProgress, dailyAmounts, notes, selectedGoal]);

            const saveName = () => {
                if (userName.trim()) {
                    localStorage.setItem('userName', userName);
                    setShowNamePrompt(false);
                }
            };

            const calculateStreak = () => {
                const days = Object.keys(dailyProgress).sort((a, b) => parseInt(b) - parseInt(a));
                let streak = 0;
                for (let i = 0; i < days.length; i++) {
                    if (dailyProgress[days[i]]) streak++;
                    else break;
                }
                setCurrentStreak(streak);
            };

            const toggleDay = (day) => {
                const newProgress = { ...dailyProgress, [day]: !dailyProgress[day] };
                setDailyProgress(newProgress);
                if (!dailyProgress[day]) {
                    setShowCelebration(true);
                    setTimeout(() => setShowCelebration(false), 2000);
                }
            };

            const updateDailyAmount = (day, amount) => {
                setDailyAmounts({ ...dailyAmounts, [day]: parseFloat(amount) || 0 });
            };

            const updateNote = (day, note) => {
                setNotes({ ...notes, [day]: note });
            };

            const createCustomGoal = () => {
                const value = parseFloat(customValue);
                const days = parseInt(customDays);
                if (value > 0 && days > 0 && days <= 365) {
                    const customGoal = {
                        value: value,
                        label: `R$ ${value.toLocaleString('pt-BR', { minimumFractionDigits: 2 })}`,
                        color: 'from-indigo-400 to-purple-600',
                        days: days,
                        isCustom: true
                    };
                    setSelectedGoal(customGoal);
                    setShowCustomGoal(false);
                }
            };

            const calculateStats = () => {
                if (!selectedGoal) return { completed: 0, remaining: 0, saved: 0, percentage: 0, dailyAmount: 0 };
                const completed = Object.values(dailyProgress).filter(Boolean).length;
                const remaining = selectedGoal.days - completed;
                const defaultDailyAmount = selectedGoal.value / selectedGoal.days;
                const saved = Object.keys(dailyProgress).reduce((total, day) => {
                    if (dailyProgress[day]) {
                        return total + (dailyAmounts[day] || defaultDailyAmount);
                    }
                    return total;
                }, 0);
                const percentage = (saved / selectedGoal.value) * 100;
                return { completed, remaining, saved, percentage, dailyAmount: defaultDailyAmount };
            };

            const stats = calculateStats();

            const getBadges = () => {
                const badges = [];
                if (stats.completed >= 7) badges.push({ icon: '⚡', text: '7 dias seguidos!', color: 'text-yellow-500' });
                if (stats.completed >= 14) badges.push({ icon: '🔥', text: '2 semanas!', color: 'text-orange-500' });
                if (stats.completed >= 30) badges.push({ icon: '🏆', text: '1 mês completo!', color: 'text-orange-600' });
                if (stats.completed >= 60) badges.push({ icon: '⭐', text: '2 meses!', color: 'text-purple-500' });
                if (stats.percentage >= 25) badges.push({ icon: '🎯', text: '25% da meta!', color: 'text-blue-500' });
                if (stats.percentage >= 50) badges.push({ icon: '🏅', text: '50% da meta!', color: 'text-purple-500' });
                if (stats.percentage >= 75) badges.push({ icon: '🎁', text: '75% da meta!', color: 'text-pink-500' });
                if (stats.percentage >= 100) badges.push({ icon: '🏆', text: 'META COMPLETA!', color: 'text-green-500' });
                if (currentStreak >= 10) badges.push({ icon: '🔥', text: `${currentStreak} dias de sequência!`, color: 'text-red-500' });
                return badges;
            };

            const downloadReport = () => {
                const report = `
RELATÓRIO FINANCEIRO - ${selectedGoal.label}
${userName ? `Cliente: ${userName}` : ''}
Data: ${new Date().toLocaleDateString('pt-BR')}

RESUMO:
- Meta: ${selectedGoal.label} em ${selectedGoal.days} dias
